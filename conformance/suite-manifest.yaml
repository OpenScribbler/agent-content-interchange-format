- suite: 11
  date: 2026-09-30
  change_class: repair
  supersedes: 10
  note: "Repair: the runner credited passes no conforming-or-not observation supported. (1) Presence before relation (PROTOCOL §3, an asserted field absent from `result` is a fail): `assert_relation` now fails any check whose observed values contain an absent field, so an absent field equal to another absent field no longer satisfies an equality or distinctness relation. Repaired vectors an all-empty adapter passed: TV-MCP-k2, TV-MCP-l, TV-RENDER-a, TV-URI-r, TV-URI-s, TV-URI-t; the rule applies to every vector asserted through `assert_relation`. TV-URI-s keeps one spec-defined exception: [ACIF-REGISTRY] §6 makes `metadata_hash` REQUIRED iff `publisher_section` is present, so both records omitting both on its frontmatter-less fixture is identical; `body_hash` must still be present. (2) TV-RENDER-d: a round-trip leg (ingest, render, re-ingest) that answers with a spec error fails the case's check instead of skipping it, in both cases. case_2 checks [ACIF-RENDER] §9 structurally: the adapter's pre-render canonical `agent.tools` must equal the rendered vector's tool list, the round-tripped `agent.tools` must equal it after the write-edit collapse (applied to that tool-name field only), and every field outside `agent.tools` must round-trip unchanged; the adapter's `lossy` declaration alone no longer passes. Runner-side, outside the binding set: the request write and the response read share one per-request deadline, covering partial response lines and adapters that stop reading stdin; hello rejects any `adapter_protocol` that is not an exact integer (boolean `true`, float `2.0`) and unknown scopes; ok responses carrying `error` and error responses carrying `result` are harness errors; the CLI exits 1 on any fail, harness-error, or failed handshake; the differential's `clean` requires agreeing observations in every family both adapters' claimed scopes require, and a trial counts as agreement only when both answers carry the family's answer fields (hash, identity or verdict), otherwise it is `incomplete`; hook_mechanism compares whole canonical bytes ([ACIF-HOOK] §7.4) rather than handlers only; sabotage kills count only against baseline passes. Catalogs unchanged; expectation-flip inventory: EMPTY."
