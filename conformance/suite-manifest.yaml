- suite: 14
  date: 2026-10-25
  change_class: repair
  supersedes: 13
  note: "Repair: TV-RULE-m asserted that a render of a manual rule to a no-declaration-surface target emits the text rule-body, but its canonical fixture carried no rule body. A conforming renderer, which emits the body it is given byte-verbatim ([ACIF-RULE] §11, §8.3) and never invents text, could not pass it; a renderer that invents text could, and the published suite 6 run `conformance/evidence/differential-hook-evidence-2026-07-16/syllago-static-report.json` records exactly that: TV-RULE-m passes with `rule-body` emitted from the bodiless canonical. The binding now ingests a manual rule source whose body is \"Follow @security.md before editing.\\n\" and renders the adapter's own canonical record, so the suite pins no body field; an ingest that does not answer ok fails the vector and the render is skipped. The target has no declaration surface, so the emitted check compares the whole render output to that body, trailing newline included, and the activation_degraded diagnostic check is unchanged. TV-RENDER-c's paired-degradation invariant no longer reports a trigger path as unexercised when its trigger vector already failed, was unsupported, or hit a harness error before the render. Repaired vector: TV-RULE-m. Expectation-flip inventory: TV-RULE-m (emitted). Runner-side, outside the binding set: the adapter transport reads stdout from a background thread instead of select(), so the runner drives adapters on Windows; the thread owns and closes the stdout pipe, and a bounded queue sized above the 16 MiB line limit keeps it from reading ahead without limit."
