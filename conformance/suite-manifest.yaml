# ACIF conformance suite manifest (CHANGE-PROCESS.md).
#
# The published, monotonic artifact consumers compare a conformance
# report's pinned hashes against. One entry per suite change, newest
# first; every suite change MUST append an entry (the runner selftest
# fails if the head entry drifts from the working tree).
#
# change_class: initial | b | c | repair | mixed — what kind of change
# produced the entry. Class C entries carry their expectation-flip
# inventory in the SHAPE.md decision row the note names. `repair`
# corrects a published vector or binding whose expectation no conforming
# implementation could satisfy (CHANGE-PROCESS.md "Suite-defect
# repairs"); its note names the repaired vectors. Prior suite history
# predates this manifest and lives in git.

- suite: 15
  date: 2026-10-26
  change_class: c
  supersedes: 14
  note: "Class C (SHAPE.md Decision #52). [ACIF-CORE] §2 defines frontmatter values as the JSON values of the YAML 1.2 core-schema parse and names the malformed conditions (a block that is not valid UTF-8 or holds more than one YAML document, top level not a map, a duplicate key at any level, a non-string key, an anchor, alias, or explicit tag, a raw U+0085, U+2028, or U+2029 or any raw character outside c-printable, nesting deeper than 64, a \\u or \\U escape naming a surrogate whether paired or not, a key or string holding a noncharacter, a non-finite float, an integer beyond +/-(2^53-1)) with the new reject acif.frontmatter.malformed; << is an ordinary key; a block whose parse is null, or {}, declares nothing. [ACIF-PUBLISHER] §5.6 fixes how frontmatter becomes publisher_section, in an order that is also the reject precedence, after the [ACIF-CORE] §7.4 body rejects: parse, no declaration, null values dropped, forbidden fields, the kind check (the new reject acif.publisher.frontmatter_kind_mismatch for a declared kind that is not frontmatter-bearing or differs from the context-assigned kind), placement by top-level key name (envelope keys and a mapping-valued license at the top, every other key under publisher_section.<assigned kind>, kind only when declared), and envelope validation of the minted fields in the order id, version, license.spdx; §7 pins the flat projection back and requires projection tooling to refuse, naming the key, a kind-block member that collides with an envelope name or kind, or holds null. [ACIF-CORE] §7.4 step 3 reads raw paths before NFC and rejects a body path that is not valid UTF-8 with the new acif.body.path_not_utf8, then one holding U+0000-U+001F or U+007F in any component with the new acif.body.path_control_char, both scans ahead of the collision check; [ACIF-HOOK] §9.2 applies both to referenced script paths after acif.hook.event_unrecognized and acif.hook.handlers_missing and ahead of acif.hook.script_path_invalid. Additive vectors: TV-14 (four control-character rejects and a U+0080 accept with its body_hash; a non-UTF-8 name rejected with acif.body.path_not_utf8, which wins over a control character; a control character winning over an NFC collision; capabilities control_char_names and non_utf8_names, env-blocked where the filesystem cannot hold such a name), TV-L2-g (three byte cases with metadata_hash, null-value dropping, no-declaration blocks including a bare null, skill.skill, YAML 1.2 core-schema values, a tab separator and << as an ordinary key with metadata_hash, a block-scalar version, YAML 1.2 flow accepts (? and : starting a flow plain scalar, a space-then-tab flow line prefix) and limit accepts (depth 64, 1e20, 2^53-1) with metadata_hash, the malformed cases for a non-UTF-8 block, a second document, an anchor alone, an alias, each of the four tag forms, a raw U+2028, a raw ESC, a nested duplicate key, depth 65, a lone surrogate, a surrogate-pair escape, a noncharacter, and 1e400, and the forbidden-field, kind, and version rejects; the envelope rejects travel as the verdict, with reasons asserted under adapter protocol 2), and TV-HOOK-j (a traversing script path holding LF rejects with acif.body.path_control_char; its binding now sends every case). The reference adapter builds publisher_section by §5.6, so its metadata_hash changes for every frontmatter item that has a publisher_section. The core binding gains files_raw_path_hex for a non-UTF-8 name and files_hex for non-UTF-8 file content. Runner-side, outside the binding set: the fixture writer probes control_char_names and non_utf8_names. Vector-impact inventory: no expectation flips; TV-L2-a asserts presence only, TV-L2-c's tools path is an extension key under both layouts, and TV-9 and TV-L2-b are sidecar inputs."
