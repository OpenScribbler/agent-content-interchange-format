- suite: 12
  date: 2026-09-30
  change_class: c
  supersedes: 11
  note: "Class C (SHAPE.md Decisions #46 and #47). #46 corrects [ACIF-HOOK] Appendix A.1 provider columns: cursor takes the camelCase names `.cursor/hooks.json` accepts (preToolUse, postToolUse, beforeSubmitPrompt, stop, sessionStart, sessionEnd, subagentStart, subagentStop, preCompact); cursor beforeAgentResponse and beforeToolSelection and factory-droid SubagentStart are removed; factory-droid Notification and devin PreToolUse, PostToolUse, PermissionRequest, PostCompaction and post_write_code are added, with A.4 degraded pins for devin file_changed and for cursor after_model (afterAgentResponse fires once and only observes, so a hook that rewrites model output loses its effect). Every retired cursor spelling stays recognized through claude-code, so no canonical bytes move; render to cursor changes. #47 mints before_shell_execute, after_shell_execute, before_mcp_execute, after_mcp_execute and before_file_read on cursor and devin Cascade evidence, each devin pair pinned degraded in A.4 (44 events); §6.2 carries matchers on the five events through untranslated, and A.1 states they never hash equal to the general tool events. Additive vectors: TV-HOOK-n (cursor camelCase canonicalizes, retired spellings hash equal, the two removed names and the unmapped afterAgentThought and pre_write_code reject), TV-HOOK-o (lossless single-name renders to cursor, devin and factory-droid), TV-HOOK-p (the five events canonicalize from both providers and hash equal; devin PostCompaction and post_write_code canonicalize), TV-HOOK-q (degraded renders with params: six devin Cascade pins, the cursor after_model pin and three A.4 rule 4 pairs), TV-HOOK-r (shell command and MCP server matchers pass through untranslated; a narrow event and the general tool event hash distinct). Vector-impact inventory: EMPTY — no published vector names a removed native name, asserts a reject for any newly recognized name or new canonical name, or renders a hook to cursor, factory-droid or claude-code. Row-data amendment folded in: [ACIF-INSTALL] Appendix A.2 cursor hook rows move to ~/.cursor/hooks.json and .cursor/hooks.json (as_of 2026-09-30) and the settings.json rows are superseded; the install-entry-points export changes, and no vector fixture pins those rows, so install.yaml is unchanged. The reference adapter now carries the full A.1 table and A.4 resolution order, and a new selftest check diffs it against A.1 and A.4; the differential hook pools take the cursor camelCase spelling and add before_file_read."
