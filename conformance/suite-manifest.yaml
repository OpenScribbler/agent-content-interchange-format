- suite: 13
  date: 2026-10-24
  change_class: c
  supersedes: 12
  note: "Class C (SHAPE.md Decisions #49, #50 and #51). #49 redefines [ACIF-REGISTRY] §6 attestation_hash as the attestation input digest, SHA-256 over the acif-attestation-input-v1 preimage of body_hash and metadata_hash, so an attestation binds the stripped frontmatter grants too; a value other than the digest of the record's own hashes, or the field on a pack record, is the new record-emit reject acif.registry.attestation_hash_mismatch (§12). A consumer recomputes both hashes over the fetched item bytes the install is rendered from (canonical body and any publisher sidecar), credits only an attestation whose signed subject digest equals the derived digest, and evaluates an absent field unattested (§11.3). Additive vectors: TV-L3-e over schema-complete records (correct digest with and without metadata_hash accepts, each metadata_hash the [ACIF-PUBLISHER] §6 digest of the case's publisher_section; a differing value, a body_hash copy, the right value under another algorithm, a body-only digest on an item carrying metadata_hash, and pack-record presence reject; a pack record without the field accepts) and TV-FRESH-l (an absent attestation_hash evaluates unattested although the injected evaluation is valid); the reference adapter's registry_emit surface derives the digest. #50 states [ACIF-INSTALL] §10's hook contribution key as an observable install-install-uninstall outcome, met through an install record placed beside the shared file at project scope, structured-decoding matching, multiset removal counted over the install records the uninstalling tool can read (a shared file written by more than one install tool is outside the guarantee; unaccounted-for instances stay and are disclosed), deletion of the item's record on uninstall, and the new warn acif.install.contribution_not_found; not vectorable under adapter protocol 2 (no merge or uninstall op). #51 has [ACIF-HOOK] §11 refuse a blocking hook whose event renders degraded (A.4 degraded row, rule 3 or rule 4) or whose provider is absent from A.1 (rule 5), with an override scoped to one item and provider and kept in an install record whatever the layout; acif.hook.event_untranslatable gains params.disposition (refused, overridden, proceeded), pinned in PROTOCOL Appendix A. evaluate_install gains the additive install_target_provider and install_operator_override fields. Additive vector: TV-HOOK-s (degraded refused, overridden, non-blocking proceeded, rule-4 refused, rule-5 refused, lossless proceed). The shared diagnostic assertion now passes when any instance of the expected id carries the expected params and no instance carries a pinned key with a different value, so an install tool that also emits the §12.3 render-time event_untranslatable is not failed by emission order, while contradictory dispositions for one provider still fail (selftest regression); no other vector's result changes. The reference adapter's evaluate_install evaluates the OS coverage-gap and degraded-event rules together and discloses both. Vector-impact inventory: no expectation flips; TV-FRESH-a/b/c fixture bytes change (attestation_hash \"ab12\" becomes the conformant digest beside an added body_hash), and TV-FRESH-j's crawl records gain body_hash and the conformant digest so the lapse, not the absent field, degrades its tier; expectations unchanged; no published vector installs a hook per provider or exercises shared-file merge."
