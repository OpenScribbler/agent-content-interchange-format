- id: TV-L3-a
  spec: "[ACIF-REGISTRY] §7"
  harness: static
  description: tuple endpoint shape — metadata_hash member null exactly when publisher_section absent
  input:
    pack_members:
      - {item_id: "aaaa...", publisher_section: present}
      - {item_id: "bbbb...", publisher_section: absent}
  expect:
    tuple_fields: [item_id, body_hash, metadata_hash_if_present, version_if_declared]
    member_1.metadata_hash: present
    member_2.metadata_hash: null

- id: TV-L3-b
  spec: "[ACIF-REGISTRY] §8.5"
  harness: static
  description: install_scope_capabilities entry without a source provenance tag is non-conformant
  input:
    projection: {global: {supported: true}}
  expect:
    conformant: false
    reason: acif.registry.provenance_tag_missing
    reason_note: missing-provenance-tag

- id: TV-L3-c
  spec: "[ACIF-REGISTRY] §8.3"
  harness: static
  description: advisory entry without a method stamp is non-conformant
  input:
    advisory: {argument_substitution_token: {present: true}}
  expect:
    conformant: false
    reason: acif.registry.method_stamp_missing
    reason_note: missing-method-stamp

- id: TV-L3-d
  spec: "[ACIF-CORE] §10; [ACIF-REGISTRY] §9"
  harness: static
  description: revoked-reference refusal — install refuses an item carrying a revoked cross-reference absent operator opt-in
  input:
    item:
      cross_references:
        - source_path: "agent.mcp_servers[0]"
          declared_name: "figma"
          target_kind: mcp_config
          resolution: revoked
          diagnostic: "target a1b2c3d4-... revoked by its registry"
  expect:
    install: refuse-unless-operator-opt-in

