# ACIF conformance vectors — TV-INSTALL-* ([ACIF-INSTALL] §6–§11, Appendix B)
# Entry-point resolution over the install-target matrix. Matrix-pinned
# vectors resolve against the published conformance/install-entry-points.yaml
# rows; grammar and disposition vectors supply a fully-formed `entry`
# override per PROTOCOL §4.14. Normative.

- id: TV-INSTALL-a
  spec: "[ACIF-INSTALL] §6, §8.3"
  harness: static
  description: multiplicity and write-target selection — copilot-cli agent resolves three rows, order preserved, first current row per scope is the write target
  input:
    provider: copilot-cli
    content_type: agent
    content_name: reviewer
    home_dir: /home/u
    project_root: /proj
  expect:
    targets:
      - {scope: user, path: /home/u/.github/agents/reviewer.md, layout: single_file, status: current, write_target: true}
      - {scope: project, path: /proj/.copilot/agents/reviewer.md, layout: single_file, status: current, write_target: true}
      - {scope: project, path: /proj/.github/agents/reviewer.md, layout: single_file, status: current, write_target: false}

- id: TV-INSTALL-b
  spec: "[ACIF-INSTALL] §9"
  harness: static
  description: layout coverage — all three layouts across all six content types (six-coequal witness)
  input:
    cases:
      - {provider: claude-code, content_type: agent, content_name: helper, home_dir: /h, project_root: /p, scope: user}
      - {provider: factory-droid, content_type: command, content_name: deploy, home_dir: /h, project_root: /p, scope: project}
      - {provider: claude-code, content_type: hook, content_name: guard, home_dir: /h, project_root: /p, scope: user}
      - {provider: kiro, content_type: mcp_config, content_name: search, home_dir: /h, project_root: /p, scope: project}
      - {provider: cursor, content_type: rule, content_name: style, home_dir: /h, project_root: /p, scope: project}
      - {provider: gemini-cli, content_type: skill, content_name: review, home_dir: /h, project_root: /p, scope: user}
  expect:
    case_1:
      targets:
        - {scope: user, path: /h/.claude/agents/helper.md, layout: single_file, status: current, write_target: true}
    case_2:
      targets:
        - {scope: project, path: /p/.factory/commands/deploy.md, layout: single_file, status: current, write_target: true}
    case_3:
      targets:
        - {scope: user, path: /h/.claude/settings.json, layout: merged_into_shared_file, status: current, write_target: true}
    case_4:
      targets:
        - {scope: project, path: /p/.kiro/settings/mcp.json, layout: merged_into_shared_file, status: current, write_target: true}
    case_5:
      targets:
        - {scope: project, path: /p/.cursor/rules/style.mdc, layout: single_file, status: current, write_target: true}
        - {scope: project, path: /p/.cursorrules, layout: merged_into_shared_file, status: current, write_target: false}
    case_6:
      targets:
        - {scope: user, path: /h/.gemini/skills/review/, layout: directory_of_files, status: current, write_target: true}
        - {scope: user, path: /h/.agents/skills/review/, layout: directory_of_files, status: current, write_target: false}

- id: TV-INSTALL-c
  spec: "[ACIF-INSTALL] §8.2, §13"
  harness: static
  description: content-name validity predicate — separator, backslash, dot-segment, and empty names reject before path formation
  input:
    variants:
      - {provider: claude-code, content_type: command, content_name: "a/b", home_dir: /h, project_root: /p}
      - {provider: claude-code, content_type: command, content_name: "a\\b", home_dir: /h, project_root: /p}
      - {provider: claude-code, content_type: command, content_name: "..", home_dir: /h, project_root: /p}
      - {provider: claude-code, content_type: command, content_name: "", home_dir: /h, project_root: /p}
  expect:
    error: acif.install.content_name_invalid

- id: TV-INSTALL-d
  spec: "[ACIF-INSTALL] §8.1"
  harness: static
  description: placeholder totality — a row token outside the closed grammar refuses the write direction
  input:
    provider: claude-code
    content_type: command
    content_name: deploy
    home_dir: /h
    project_root: /p
    entry: {scope: user, path_template: "~/.claude/commands/<unknown-variant>/<content-name>.md", layout: single_file, status: current}
  expect:
    error: acif.install.placeholder_unrecognized

- id: TV-INSTALL-e
  spec: "[ACIF-INSTALL] §11, §12"
  harness: static
  description: disposition lanes — no_entry_point and scope_unavailable refuse with pinned params; supersession warns and proceeds
  input:
    cases:
      - {provider: cline, content_type: hook, content_name: guard, home_dir: /h, project_root: /p}
      - {provider: kiro, content_type: rule, content_name: style, home_dir: /h, project_root: /p, scope: user}
      - {provider: claude-code, content_type: command, content_name: deploy, home_dir: /h, project_root: /p,
         entry: {scope: user, path_template: "~/.claude/commands/<content-name>.md", layout: single_file, status: superseded}}
  expect:
    case_1: {error: acif.install.no_entry_point}
    case_2: {error: acif.install.scope_unavailable, params: {available_scopes: [project]}}
    case_3:
      targets:
        - {scope: user, path: /h/.claude/commands/deploy.md, layout: single_file, status: superseded, write_target: false}
      diagnostic: acif.install.entry_point_superseded

- id: TV-INSTALL-f
  spec: "[ACIF-INSTALL] §8.3"
  harness: static
  description: anchor resolution — home-anchored, project-anchored, and absolute managed templates resolve against invocation-supplied roots
  input:
    cases:
      - {provider: pi, content_type: hook, content_name: tracer, home_dir: /home/dev, project_root: /work/repo, scope: user}
      - {provider: pi, content_type: hook, content_name: tracer, home_dir: /home/dev, project_root: /work/repo, scope: project}
      - {provider: claude-code, content_type: agent, content_name: auditor, home_dir: /home/dev, project_root: /work/repo,
         entry: {scope: managed, path_template: "/etc/acme/agents/<content-name>.md", layout: single_file, status: current}}
  expect:
    case_1:
      targets:
        - {scope: user, path: /home/dev/.pi/agent/extensions/tracer.ts, layout: single_file, status: current, write_target: true}
    case_2:
      targets:
        - {scope: project, path: /work/repo/.pi/extensions/tracer.ts, layout: single_file, status: current, write_target: true}
    case_3:
      targets:
        - {scope: managed, path: /etc/acme/agents/auditor.md, layout: single_file, status: current, write_target: true}

- id: TV-INSTALL-g
  spec: "[ACIF-INSTALL] §6, §8.3"
  harness: static
  description: OS selection — devin rows filter to the target OS before precedence, so the write target differs by OS; an <appdata>-anchored row resolves against the invocation-supplied application-data directory; a list that filtering empties refuses with no_entry_point, even when a scope is requested
  input:
    cases:
      - {provider: devin, content_type: rule, content_name: style, os: linux, home_dir: /home/u, project_root: /p, scope: user}
      - {provider: devin, content_type: rule, content_name: style, os: windows, home_dir: "C:/Users/u", appdata_dir: "D:/Roaming/u", project_root: "C:/p", scope: user}
      - {provider: devin, content_type: skill, content_name: review, os: darwin, home_dir: /Users/u, project_root: /p, scope: managed}
      - {provider: devin, content_type: skill, content_name: review, os: windows, home_dir: "C:/Users/u", appdata_dir: "D:/Roaming/u", project_root: "C:/p", scope: managed}
      - {provider: claude-code, content_type: hook, content_name: guard, os: linux, home_dir: /h, project_root: /p,
         entry: {scope: managed, os: [windows], path_template: "C:/ProgramData/Acme/hooks.json", layout: merged_into_shared_file, status: current}}
      - {provider: claude-code, content_type: hook, content_name: guard, os: linux, home_dir: /h, project_root: /p, scope: managed,
         entry: {scope: managed, os: [windows], path_template: "C:/ProgramData/Acme/hooks.json", layout: merged_into_shared_file, status: current}}
  expect:
    case_1:
      targets:
        - {scope: user, path: /home/u/.config/devin/AGENTS.md, layout: merged_into_shared_file, status: current, write_target: true}
        - {scope: user, path: /home/u/.devin/rules/style.md, layout: single_file, status: current, write_target: false}
        - {scope: user, path: /home/u/.devin/global_rules.md, layout: merged_into_shared_file, status: current, write_target: false}
        - {scope: user, path: /home/u/.codeium/windsurf/memories/global_rules.md, layout: merged_into_shared_file, status: current, write_target: false}
    case_2:
      targets:
        - {scope: user, path: "D:/Roaming/u/devin/AGENTS.md", layout: merged_into_shared_file, status: current, write_target: true}
        - {scope: user, path: "C:/Users/u/.devin/rules/style.md", layout: single_file, status: current, write_target: false}
        - {scope: user, path: "C:/Users/u/.devin/global_rules.md", layout: merged_into_shared_file, status: current, write_target: false}
        - {scope: user, path: "C:/Users/u/.codeium/windsurf/memories/global_rules.md", layout: merged_into_shared_file, status: current, write_target: false}
    case_3:
      targets:
        - {scope: managed, path: /Library/Application Support/Devin/skills/review/, layout: directory_of_files, status: current, write_target: true}
        - {scope: managed, path: /Library/Application Support/Windsurf/skills/review/, layout: directory_of_files, status: current, write_target: false}
    case_4:
      targets:
        - {scope: managed, path: "C:/ProgramData/Devin/skills/review/", layout: directory_of_files, status: current, write_target: true}
        - {scope: managed, path: "C:/ProgramData/Windsurf/skills/review/", layout: directory_of_files, status: current, write_target: false}
    case_5: {error: acif.install.no_entry_point}
    case_6: {error: acif.install.no_entry_point}

- id: TV-INSTALL-h
  spec: "[ACIF-INSTALL] §6.1, §8.3, §11"
  harness: static
  description: "operator overlay — an overlay row precedes its scope's matrix rows and becomes the write target, matrix rows still listed for read; an overlay fills a pair or a scope the matrix has no rows for (matrix_write_target null); every overlaid scope carries exactly one entry_point_overridden naming its scope, and a matrix-resolved scope carries none; absolute overlay templates carry os and resolve verbatim; the anchor is read off the template, so a content name of C: or ~ stays project-anchored; a row field named overlay confers no overlay origin; an overlaid scope whose matrix write row carries an unknown token refuses; an overlay over a superseded-only matrix scope names the superseded row and carries no supersession warning; no other install diagnostic rides a resolution, and a refusal carries no overridden warning; content_name_invalid and placeholder_unrecognized hold for overlay rows; an absent, other-scope, or OS-filtered overlay leaves the absence refusals unchanged, and a pair whose only rows are overlay rows takes the same lanes; each overlay_invalid reason refuses with its row index, a backslash, a non-leading ~ segment, a home-anchored project row, and non-string scope and layout values included"
  input:
    cases:
      - {provider: claude-code, content_type: skill, content_name: review, home_dir: /h, project_root: /p, scope: user,
         overlay: [{scope: user, path_template: "~/dotfiles/claude/skills/<content-name>/", layout: directory_of_files, status: current}]}
      - {provider: cline, content_type: hook, content_name: guard, os: linux, home_dir: /h, project_root: /p,
         overlay: [{scope: user, os: [darwin, linux], path_template: "/opt/cline-hooks/<content-name>.json", layout: single_file, status: current}]}
      - {provider: kiro, content_type: rule, content_name: style, home_dir: /h, project_root: /p, scope: user,
         overlay: [{scope: user, path_template: "~/.kiro/steering/<content-name>.md", layout: single_file, status: current}]}
      - {provider: copilot-cli, content_type: agent, content_name: reviewer, home_dir: /home/u, project_root: /proj,
         overlay: [{scope: project, path_template: ".team/agents/<content-name>.md", layout: single_file, status: current}]}
      - {provider: claude-code, content_type: command, content_name: "..", home_dir: /h, project_root: /p,
         overlay: [{scope: user, path_template: "~/commands/<content-name>.md", layout: single_file, status: current}]}
      - {provider: cline, content_type: hook, content_name: guard, home_dir: /h, project_root: /p}
      - {provider: kiro, content_type: rule, content_name: style, home_dir: /h, project_root: /p, scope: user,
         overlay: [{scope: project, path_template: ".kiro/steering/team/<content-name>.md", layout: single_file, status: current}]}
      - {provider: cline, content_type: hook, content_name: guard, os: linux, home_dir: /h, project_root: /p,
         overlay: [{scope: user, os: [windows], path_template: "C:/Tools/cline-hooks/<content-name>.json", layout: single_file, status: current}]}
      - {provider: claude-code, content_type: command, content_name: deploy, home_dir: /h, project_root: /p, scope: user,
         overlay: [{scope: user, path_template: "~/<unknown-dir>/commands/<content-name>.md", layout: single_file, status: current}]}
      - {provider: cline, content_type: hook, content_name: guard, home_dir: /h, project_root: /p, scope: user,
         overlay: [{scope: project, path_template: ".team/hooks/<content-name>.json", layout: single_file, status: current}]}
      - {provider: copilot-cli, content_type: agent, content_name: reviewer, home_dir: /home/u, project_root: /proj,
         overlay: [{scope: user, path_template: "~/team/agents/<content-name>.md", layout: single_file, status: current},
                   {scope: project, path_template: ".team/agents/<content-name>.md", layout: single_file, status: current}]}
      - {provider: cline, content_type: hook, content_name: guard, os: windows, home_dir: "C:/Users/u", project_root: "C:/src/p",
         overlay: [{scope: user, os: [windows], path_template: "C:/Tools/cline-hooks/<content-name>.json", layout: single_file, status: current}]}
      - {provider: cline, content_type: hook, content_name: "C:", home_dir: /h, project_root: /p, scope: project,
         overlay: [{scope: project, path_template: "<content-name>/<content-name>.json", layout: single_file, status: current}]}
      - {provider: claude-code, content_type: skill, content_name: "~", home_dir: /h, project_root: /p, scope: project,
         overlay: [{scope: project, path_template: "<content-name>/", layout: directory_of_files, status: current}]}
      - {provider: claude-code, content_type: skill, content_name: review, home_dir: /h, project_root: /p,
         entry: {scope: project, path_template: ".agents/skills/<content-name>/", layout: directory_of_files, status: current, overlay: true}}
      - {provider: cline, content_type: hook, content_name: guard, home_dir: /h, project_root: /p,
         overlay: {scope: user, path_template: "~/hooks/<content-name>.json", layout: single_file, status: current}}
      - {provider: cline, content_type: hook, content_name: guard, home_dir: /h, project_root: /p,
         overlay: [{scope: global, path_template: "~/hooks/<content-name>.json", layout: single_file, status: current}]}
      - {provider: cline, content_type: hook, content_name: guard, home_dir: /h, project_root: /p,
         overlay: [{scope: user, path_template: "~/hooks/<content-name>.json", layout: single_file, status: superseded}]}
      - {provider: cline, content_type: hook, content_name: guard, home_dir: /h, project_root: /p,
         overlay: [{scope: user, os: [darwin, linux], path_template: "<appdata>/cline/<content-name>.json", layout: single_file, status: current}]}
      - {provider: cline, content_type: hook, content_name: guard, home_dir: /h, project_root: /p,
         overlay: [{scope: user, os: [darwin, linux], path_template: "//server/hooks/<content-name>.json", layout: single_file, status: current}]}
      - {provider: cline, content_type: hook, content_name: guard, home_dir: /h, project_root: /p,
         overlay: [{scope: user, path_template: "~/hooks/../<content-name>.json", layout: single_file, status: current}]}
      - {provider: cline, content_type: hook, content_name: guard, home_dir: /h, project_root: /p,
         overlay: [{scope: user, path_template: "hooks/<content-name>.json", layout: single_file, status: current}]}
      - {provider: cline, content_type: hook, content_name: guard, home_dir: /h, project_root: /p,
         overlay: [{scope: user, path_template: "/opt/hooks/<content-name>.json", layout: single_file, status: current}]}
      - {provider: cline, content_type: hook, content_name: guard, home_dir: /h, project_root: /p,
         overlay: [{scope: user, path_template: "~/", layout: directory_of_files, status: current}]}
      - {provider: cline, content_type: hook, content_name: guard, home_dir: /h, project_root: /p,
         overlay: [{scope: user, path_template: "~/hooks/<content-name>.json", layout: single_file, status: current},
                   {scope: user, path_template: "~/hooks/<content-name>.json", layout: single_file, status: current}]}
      - {provider: claude-code, content_type: command, content_name: d, home_dir: /h, project_root: /p,
         entry: {scope: user, path_template: "~/old/<content-name>.md", layout: single_file, status: superseded},
         overlay: [{scope: user, path_template: "~/new/<content-name>.md", layout: single_file, status: current}]}
      - {provider: cline, content_type: hook, content_name: guard, os: windows, home_dir: "C:/Users/u", project_root: "C:/src/p",
         overlay: [{scope: project, path_template: ".team\\..\\..\\x/<content-name>.json", layout: single_file, status: current}]}
      - {provider: cline, content_type: hook, content_name: guard, home_dir: /h, project_root: /p,
         overlay: [{scope: project, path_template: "~/hooks/<content-name>.json", layout: single_file, status: current}]}
      - {provider: cline, content_type: hook, content_name: guard, home_dir: /h, project_root: /p,
         overlay: [{scope: [], path_template: "~/hooks/<content-name>.json", layout: single_file, status: current}]}
      - {provider: cline, content_type: hook, content_name: guard, home_dir: /h, project_root: /p,
         overlay: [{scope: user, path_template: "~/hooks/<content-name>.json", layout: {}, status: current}]}
      - {provider: claude-code, content_type: command, content_name: d, home_dir: /h, project_root: /p, scope: user,
         entry: {scope: user, path_template: "~/<unknown-dir>/<content-name>.md", layout: single_file, status: current},
         overlay: [{scope: user, path_template: "~/new/<content-name>.md", layout: single_file, status: current}]}
      - {provider: cline, content_type: hook, content_name: guard, home_dir: /h, project_root: /p,
         overlay: [{scope: project, path_template: "a/~/<content-name>.json", layout: single_file, status: current}]}
  expect:
    case_1:
      targets:
        - {scope: user, path: /h/dotfiles/claude/skills/review/, layout: directory_of_files, status: current, write_target: true}
        - {scope: user, path: /h/.claude/skills/review/, layout: directory_of_files, status: current, write_target: false}
      overridden:
        - {scope: user, overlay_path: /h/dotfiles/claude/skills/review/, matrix_write_target: /h/.claude/skills/review/}
    case_2:
      targets:
        - {scope: user, path: /opt/cline-hooks/guard.json, layout: single_file, status: current, write_target: true}
      overridden:
        - {scope: user, overlay_path: /opt/cline-hooks/guard.json, matrix_write_target: null}
    case_3:
      targets:
        - {scope: user, path: /h/.kiro/steering/style.md, layout: single_file, status: current, write_target: true}
      overridden:
        - {scope: user, overlay_path: /h/.kiro/steering/style.md, matrix_write_target: null}
    case_4:
      targets:
        - {scope: project, path: /proj/.team/agents/reviewer.md, layout: single_file, status: current, write_target: true}
        - {scope: user, path: /home/u/.github/agents/reviewer.md, layout: single_file, status: current, write_target: true}
        - {scope: project, path: /proj/.copilot/agents/reviewer.md, layout: single_file, status: current, write_target: false}
        - {scope: project, path: /proj/.github/agents/reviewer.md, layout: single_file, status: current, write_target: false}
      overridden:
        - {scope: project, overlay_path: /proj/.team/agents/reviewer.md, matrix_write_target: /proj/.copilot/agents/reviewer.md}
    case_5: {error: acif.install.content_name_invalid}
    case_6: {error: acif.install.no_entry_point}
    case_7: {error: acif.install.scope_unavailable, params: {available_scopes: [project]}}
    case_8: {error: acif.install.no_entry_point}
    case_9: {error: acif.install.placeholder_unrecognized}
    case_10: {error: acif.install.scope_unavailable, params: {available_scopes: [project]}}
    case_11:
      targets:
        - {scope: user, path: /home/u/team/agents/reviewer.md, layout: single_file, status: current, write_target: true}
        - {scope: project, path: /proj/.team/agents/reviewer.md, layout: single_file, status: current, write_target: true}
        - {scope: user, path: /home/u/.github/agents/reviewer.md, layout: single_file, status: current, write_target: false}
        - {scope: project, path: /proj/.copilot/agents/reviewer.md, layout: single_file, status: current, write_target: false}
        - {scope: project, path: /proj/.github/agents/reviewer.md, layout: single_file, status: current, write_target: false}
      overridden:
        - {scope: user, overlay_path: /home/u/team/agents/reviewer.md, matrix_write_target: /home/u/.github/agents/reviewer.md}
        - {scope: project, overlay_path: /proj/.team/agents/reviewer.md, matrix_write_target: /proj/.copilot/agents/reviewer.md}
    case_12:
      targets:
        - {scope: user, path: "C:/Tools/cline-hooks/guard.json", layout: single_file, status: current, write_target: true}
      overridden:
        - {scope: user, overlay_path: "C:/Tools/cline-hooks/guard.json", matrix_write_target: null}
    case_13:
      targets:
        - {scope: project, path: "/p/C:/C:.json", layout: single_file, status: current, write_target: true}
      overridden:
        - {scope: project, overlay_path: "/p/C:/C:.json", matrix_write_target: null}
    case_14:
      targets:
        - {scope: project, path: /p/~/, layout: directory_of_files, status: current, write_target: true}
        - {scope: project, path: /p/.claude/skills/~/, layout: directory_of_files, status: current, write_target: false}
      overridden:
        - {scope: project, overlay_path: /p/~/, matrix_write_target: /p/.claude/skills/~/}
    case_15:
      targets:
        - {scope: project, path: /p/.agents/skills/review/, layout: directory_of_files, status: current, write_target: true}
      overridden: []
    case_16: {error: acif.install.overlay_invalid, params: {reason: overlay_not_list, row_index: null}}
    case_17: {error: acif.install.overlay_invalid, params: {reason: field_invalid, row_index: 0}}
    case_18: {error: acif.install.overlay_invalid, params: {reason: status_not_current, row_index: 0}}
    case_19: {error: acif.install.overlay_invalid, params: {reason: anchor_misplaced, row_index: 0}}
    case_20: {error: acif.install.overlay_invalid, params: {reason: leading_double_slash, row_index: 0}}
    case_21: {error: acif.install.overlay_invalid, params: {reason: dot_segment, row_index: 0}}
    case_22: {error: acif.install.overlay_invalid, params: {reason: anchor_scope_mismatch, row_index: 0}}
    case_23: {error: acif.install.overlay_invalid, params: {reason: absolute_os_mismatch, row_index: 0}}
    case_24: {error: acif.install.overlay_invalid, params: {reason: content_name_placement, row_index: 0}}
    case_25: {error: acif.install.overlay_invalid, params: {reason: duplicate_row, row_index: 1}}
    case_26:
      targets:
        - {scope: user, path: /h/new/d.md, layout: single_file, status: current, write_target: true}
